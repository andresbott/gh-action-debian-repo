# The engine's example instance — what `make publish` / `make serve` build when
# run from the engine checkout. Every key is optional (see the README's
# "Configuration" table); unset ones are derived from the GitHub repository.
REPO_NAME=example
SITE_TITLE="example"
SITE_TAGLINE="A signed APT repository for Debian and Ubuntu"
REPO_URL=http://localhost:8000
GITHUB_URL=https://github.com/andresbott/gh-action-debian-repo
# violet (built in), or one of template/themes/: amber blue rose teal
THEME=violet
