# The engine's example instance — what `make publish` / `make serve` build when
# run from the engine checkout. Every key is optional (see docs/reference.md,
# "conf/site.conf"); unset ones are derived from the GitHub repository.
# REPO_NAME, REPO_URL and GITHUB_URL below are LOCAL-DEMO values: a real
# instance leaves them unset, so they come from its repository and its Pages URL
# (a committed REPO_URL would beat the Pages URL and publish a localhost repo).
REPO_NAME=example
SITE_TITLE="example"
SITE_TAGLINE="A signed APT repository for Debian and Ubuntu"
REPO_URL=http://localhost:8000
GITHUB_URL=https://github.com/andresbott/gh-action-debian-repo
# violet (built in), or one of template/themes/: amber blue rose teal
THEME=violet
