# Engine default for the releases a repository publishes — used when the
# instance has no conf/dists.conf of its own (and no `dists` workflow input).
# Copy this file to <instance>/conf/dists.conf to change it. Sourced by
# scripts/dists-lib.sh; no release name is hardcoded in any script.

# Real codename suites. Each gets a pool subtree and a signed dists/<codename>/.
# Any suite name works — an Ubuntu codename (e.g. resolute) is an ordinary entry.
# The ORDER is presentation only: the landing page lists a package's releases in
# this order, so keep it most-stable first.
DISTS="trixie forky sid"

# Rolling-suite aliases, "<alias>:<target>" space-separated. Each is published as
# its own signed dists/<alias>/ mirroring the target's Packages (Suite=<alias>,
# Codename=<target>). No separate pool. The first alias is the suite the served
# .sources file tracks.
ALIASES="stable:trixie testing:forky unstable:sid"

# Architectures indexed in every suite.
ARCHES="amd64 arm64"
