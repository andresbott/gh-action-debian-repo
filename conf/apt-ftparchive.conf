// Static branding for the autobott static APT repository's Release files.
// Suite, Codename, and Architectures are NOT set here — they are injected per
// suite (and per rolling-suite alias) by scripts/gen-index.sh via
// `-o APT::FTPArchive::Release::...` overrides, driven by conf/dists.conf.
// Consumed by `apt-ftparchive -c conf/apt-ftparchive.conf release dists/<suite>`
// (see scripts/gen-index.sh). Per-architecture Packages files are generated
// with `apt-ftparchive --arch <arch> packages pool/<codename>/main`.

APT::FTPArchive::Release {
    Origin       "autobott";
    Label        "autobott";
    Components   "main";
    Description  "autobott Debian repository";
};
