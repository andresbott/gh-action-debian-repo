# Which releases this repository publishes, and the rolling-suite aliases.
# Single source of truth — sourced by scripts/dists-lib.sh (used by hydrate,
# gen-index, render-index) and read by the Makefile. No release name is
# hardcoded in any script. Move `stable` forward by editing ALIASES here.

# Real codename suites. Each gets a pool subtree and a signed dists/<codename>/.
# Ubuntu codenames are ordinary entries here — a suite is just a name a client
# can ask for, so an Ubuntu host that matches its own codename gets packages
# built against its stack instead of falling back to the `stable` (Debian) ones.
# The ORDER matters for presentation only: render-index.sh lists a package's
# releases in this order rather than alphabetically, so keep it most-stable
# first (stable -> testing -> unstable) to match how the aliases below read,
# with the Ubuntu suites after the Debian ones.
DISTS="trixie forky sid resolute"

# Rolling-suite aliases, "<alias>:<target>" space-separated. Each is published as
# its own signed dists/<alias>/ mirroring the target's Packages, with Release
# fields Suite=<alias>, Codename=<target>. No separate pool.
# These track *Debian's* release cycle, so the Ubuntu suites get no alias: an
# Ubuntu host either matches its codename or tracks `stable` like before.
ALIASES="stable:trixie testing:forky unstable:sid"

# Architectures indexed in every suite.
ARCHES="amd64 arm64"
