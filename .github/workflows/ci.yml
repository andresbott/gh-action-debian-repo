name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends apt-utils gpgv jq python3-yaml
      - name: Tests
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: actionlint
        run: make lint

  # the build action end to end, as the publish job runs it, on the example instance
  build-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Sample packages
        run: make example-debs
      - name: Throwaway signing key
        id: key
        run: |
          export GNUPGHOME="$RUNNER_TEMP/ci-key"; install -d -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key "ci <ci@example.org>" default sign never
          { echo 'armored<<EOF_KEY'; gpg --batch --export-secret-keys --armor; echo 'EOF_KEY'; } >> "$GITHUB_OUTPUT"
      - name: Build
        id: build
        uses: ./actions/build
        with:
          instance: example
          signing-key: ${{ steps.key.outputs.armored }}
          base-url: https://example.github.io/example-debs
          site-title: CI build
      - name: Verify
        run: make verify SITE="${{ steps.build.outputs.site }}"
      - name: The site is what apt and the page expect
        env:
          SITE: ${{ steps.build.outputs.site }}
        run: |
          grep -q '^URIs: http://localhost:8000$' "$SITE/example.sources"   # example/conf/site.conf beats base-url
          grep -q 'CI build' "$SITE/index.html"
          ! grep -rq 'PRIVATE KEY' "$SITE"
